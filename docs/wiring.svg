<text x="942" y="447" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#2b2f33">5</text>
<circle cx="851" cy="469" r="8" fill="#fff" stroke="#2b2f33" stroke-width="1.5"/>
<text x="851" y="473" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#2b2f33">6</text>
<circle cx="877" cy="469" r="8" fill="#2b2f33" stroke="#2b2f33" stroke-width="1.5"/>
<text x="877" y="473" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#fff">7</text>
<circle cx="903" cy="469" r="8" fill="#1e6fe0" stroke="#2b2f33" stroke-width="1.5"/>
<text x="903" y="473" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#fff">8</text>
<circle cx="929" cy="469" r="8" fill="#fff" stroke="#2b2f33" stroke-width="1.5"/>
<text x="929" y="473" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#2b2f33">9</text>
<text x="890" y="507" class="ts" text-anchor="middle">pin numbers as printed on the</text>
<text x="890" y="521" class="ts" text-anchor="middle">DB9 breakout — check yours!</text>
<text x="270" y="640" class="ts" text-anchor="start">All ⏚ symbols are one net: ESP32 GND is tied to stove pin 7. The PC817s work as open-collector driver</text>
<text x="270" y="658" class="ts" text-anchor="start">and 5 V → 3.3 V level shifter, not as galvanic isolation. GPIO16 uses the ESP32 internal pull-up (no 10 kΩ needed).</text>
<text x="270" y="676" class="ts" text-anchor="start">Before wiring, measure your stove socket with a multimeter (stove plugged in): pin 8 ≈ 5 V, pin 3 ≈ 17 V vs pin 7.</text>
</svg>