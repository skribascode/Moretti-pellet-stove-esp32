<text x="890" y="150" class="tb" text-anchor="middle">DB9 on the stove</text>
<circle cx="832" cy="200" r="11" fill="#fff" stroke="#1e6fe0" stroke-width="2.5"/>
<text x="832" y="205" class="tb" text-anchor="middle">8</text>
<text x="852" y="200" style="font-size:14px;font-weight:700;fill:#1e6fe0">DATA</text>
<text x="852" y="216" style="font-size:11px;fill:#5f6670">≈5 V idle</text>
<circle cx="832" cy="260" r="11" fill="#fff" stroke="#2b2f33" stroke-width="2.5"/>
<text x="832" y="265" class="tb" text-anchor="middle">7</text>
<text x="852" y="260" style="font-size:14px;font-weight:700;fill:#2b2f33">GND</text>
<text x="852" y="276" style="font-size:11px;fill:#5f6670">board ground</text>
<circle cx="832" cy="320" r="11" fill="#fff" stroke="#e03131" stroke-width="2.5"/>
<text x="832" y="325" class="tb" text-anchor="middle">3</text>
<text x="852" y="320" style="font-size:14px;font-weight:700;fill:#e03131">+17 V</text>
<text x="852" y="336" style="font-size:11px;fill:#e03131">DO NOT CONNECT</text>
