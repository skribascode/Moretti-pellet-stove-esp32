# ESPHome config: ESP32 <-> Micronova pellet stove board (tested on a Moretti Design A7 SAT Glass)
#
# The ESP runs the schedule/thermostat ITSELF (it keeps working when Wi-Fi or Home Assistant
# is down). Home Assistant is the user interface: the package copies the setpoint, mode,
# on/off and time slots into the ESP (see homeassistant/packages/pellet_stove.yaml).
#
# Keep `name: poele`: the package and the card expect entity IDs such as switch.poele_poele,
# sensor.poele_etat, text.poele_plages_lundi...
# Secrets go in your ESPHome secrets.yaml (see secrets.example.yaml).

substitutions:
  # Optional direct Bluetooth reading of a SwitchBot Meter near the stove (backup when HA is unreachable)
  thermometer_mac: "AA:BB:CC:DD:EE:FF"
  # Room temperature entity in Home Assistant (main source while HA is connected)
  room_temperature_entity: sensor.room_temperature

esphome:
  name: poele
  friendly_name: Poêle

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key_poele

ota:
  - platform: esphome
    password: !secret ota_password_poele

# No fallback hotspot / captive portal on purpose: when Wi-Fi dropped, the ESP switched to its
# own hotspot and barely tried to reconnect to the router, turning a 1-minute drop into hours.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

# Time from the internet (NTP) so the schedule works without Home Assistant; HA as backup
time:
  - platform: sntp
    id: heure
    timezone: "CET-1CEST,M3.5.0,M10.5.0/3"   # POSIX string; replace with your own time zone
  - platform: homeassistant
    id: heure_ha
    timezone: "CET-1CEST,M3.5.0,M10.5.0/3"

debug:
  update_interval: 60s

# ------------------------------------------------------------------ Thermometer
# Direct reading of a SwitchBot Meter (passive BLE advertisements, no connection, no proxy).
# Low duty cycle (10 %) to leave the radio to Wi-Fi. Remove this block if you don't need it.
esp32_ble_tracker:
  scan_parameters:
    active: false
    interval: 1100ms
    window: 110ms
  on_ble_manufacturer_data_advertise:
    - mac_address: ${thermometer_mac}
      manufacturer_id: "0969"
      then:
        - lambda: |-
            if (x.size() < 11) return;
            float t = (x[9] & 0x7F) + (x[8] & 0x0F) / 10.0f;
            if (!(x[9] & 0x80)) t = -t;
            id(ble_temp) = t;
            id(ble_ms) = millis();

globals:
  - id: ble_temp
    type: float
    initial_value: "NAN"
  - id: ble_ms
    type: uint32_t
    initial_value: "0"
  - id: ha_ms
    type: uint32_t
    initial_value: "0"
  # time (epoch) of the last real off/on change, kept across reboots
  - id: dernier_changement
    type: int
    restore_value: true
    initial_value: "0"
  - id: etait_allume
    type: bool
    restore_value: true
    initial_value: "false"
  - id: alarme_verrou
    type: bool
    restore_value: true
    initial_value: "false"

uart:
  id: micronova_port
  tx_pin: GPIO17
  rx_pin:
    number: GPIO16
    mode:
      input: true
      pullup: true
  baud_rate: 1200
  data_bits: 8
  parity: NONE
  stop_bits: 2

micronova:
  uart_id: micronova_port
  enable_rx_pin: GPIO4

text_sensor:
  - platform: micronova
    stove_state:
      name: "État"
      id: etat_poele
      update_interval: 60s
      filters:
        - map:
            - Off -> Éteint
            - Start -> Démarrage
            - Pellets loading -> Chargement des granulés
            - Pellets Loading -> Chargement des granulés
            - Ignition -> Allumage
            - Working -> En chauffe
            - Brazier cleaning -> Nettoyage du brasier
            - Brazier Cleaning -> Nettoyage du brasier
            - Final cleaning -> Extinction (nettoyage final)
            - Final Cleaning -> Extinction (nettoyage final)
            - Standby -> Veille (température atteinte)
            - "No pellets alarm -> Alarme : plus de granulés"
            - "No ignition alarm -> Alarme : échec d'allumage"
            - Undefined alarm -> Alarme
      on_value:
        - lambda: |-
            if (x.rfind("Alarme", 0) == 0) id(alarme_verrou) = true;
  - platform: template
    name: "Décision programmation"
    id: decision
    icon: mdi:robot-outline
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
  - platform: version
    name: "Version ESPHome"
    hide_timestamp: true
  - platform: debug
    reset_reason:
      name: "Cause du dernier redémarrage"

# Time slots copied from Home Assistant (format "06:00-08:30,17:00-22:00")
text:
  - platform: template
    name: "Plages lundi"
    id: pl_lun
    optimistic: true
    restore_value: true
    mode: text
    max_length: 120
    entity_category: config
  - platform: template
    name: "Plages mardi"
    id: pl_mar
    optimistic: true
    restore_value: true
    mode: text
    max_length: 120
    entity_category: config
  - platform: template
    name: "Plages mercredi"
    id: pl_mer
    optimistic: true
    restore_value: true
    mode: text
    max_length: 120
    entity_category: config
  - platform: template
    name: "Plages jeudi"
    id: pl_jeu
    optimistic: true
    restore_value: true
    mode: text
    max_length: 120
    entity_category: config
  - platform: template
    name: "Plages vendredi"
    id: pl_ven
    optimistic: true
    restore_value: true
    mode: text
    max_length: 120
    entity_category: config
  - platform: template
    name: "Plages samedi"
    id: pl_sam
    optimistic: true
    restore_value: true
    mode: text
    max_length: 120
    entity_category: config
  - platform: template
    name: "Plages dimanche"
    id: pl_dim
    optimistic: true
    restore_value: true
    mode: text
    max_length: 120
    entity_category: config

sensor:
  - platform: micronova
    room_temperature:
      name: "Température ambiante"   # remote-control probe (reads 0 once the remote is retired)
      update_interval: 120s
    fumes_temperature:
      name: "Température fumées"
      memory_location: 0x00
      memory_address: 0x58
      update_interval: 300s
    stove_power:
      name: "Puissance"
      update_interval: 120s
  # Room temperature as seen by Home Assistant
  - platform: homeassistant
    id: temp_ha
    entity_id: ${room_temperature_entity}
    internal: true
    on_value:
      - lambda: id(ha_ms) = millis();
  # Temperature read directly over BLE (empty if nothing received for 10 min)
  - platform: template
    name: "Température pièce (Bluetooth)"
    id: temp_ble_sensor
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (id(ble_ms) == 0 || millis() - id(ble_ms) > 10UL * 60 * 1000) return NAN;
      return id(ble_temp);
  - platform: wifi_signal
    name: "Signal wifi"
    update_interval: 60s
  - platform: uptime
    name: "Dernier redémarrage ESP"
    type: timestamp
  - platform: debug
    free:
      name: "Mémoire libre"
    block:
      name: "Plus grand bloc mémoire"
    loop_time:
      name: "Durée de boucle"

number:
  - platform: micronova
    power_level:
      name: "Niveau de flamme"
      update_interval: 300s
  - platform: template
    name: "Consigne (ESP)"
    id: consigne
    optimistic: true
    restore_value: true
    initial_value: 21
    min_value: 15
    max_value: 25
    step: 0.5
    unit_of_measurement: "°C"
    entity_category: config

select:
  - platform: template
    name: "Mode (ESP)"
    id: mode_prog
    optimistic: true
    restore_value: true
    options:
      - "Horaire + température"
      - "Horaire seul"
      - "Température seule"
    initial_option: "Horaire + température"
    entity_category: config

binary_sensor:
  - platform: template
    name: "Alarme à traiter (ESP)"
    device_class: problem
    lambda: return id(alarme_verrou);

button:
  - platform: template
    name: "Réarmer"
    icon: mdi:restart-alert
    on_press:
      - lambda: id(alarme_verrou) = false;
      - switch.turn_off: poele_sw

switch:
  - platform: gpio
    pin: GPIO18          # feeds U3's LED (delete if R3 goes to 3V3)
    id: alim_u3
    internal: true
    restore_mode: ALWAYS_ON
  - platform: micronova
    stove:
      name: "Poêle"
      id: poele_sw
      update_interval: 120s
  - platform: template
    name: "Programmation (ESP)"
    id: prog_on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    name: "Lecture Bluetooth du thermomètre"
    id: ble_on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - esp32_ble_tracker.start_scan:
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

# ------------------------------------------------------------------ Autonomous schedule
# Runs on the ESP, with or without Home Assistant.
# Temperature: direct BLE (< 10 min old) first, else Home Assistant (while connected, or 30 min after
# a disconnection), else none -> "time slots only". Hysteresis ±0.5 °C, min 30 min off / 45 min on, alarm lock.
interval:
  - interval: 60s
    then:
      - lambda: |-
          auto now = id(heure).now();
          if (!now.is_valid()) now = id(heure_ha).now();
          if (!now.is_valid()) { id(decision).publish_state("Heure inconnue"); return; }
          const std::string etat = id(etat_poele).state;
          if (!id(etat_poele).has_state() || etat.empty()) { id(decision).publish_state("État du poêle inconnu"); return; }
          const bool alarme = etat.rfind("Alarme", 0) == 0;
          const bool allume = !alarme && etat != "Éteint";
          // remember real off/on changes (immune to disconnections)
          if (!alarme && allume != id(etait_allume)) {
            id(etait_allume) = allume;
            id(dernier_changement) = (int) now.timestamp;
          }
          if (id(alarme_verrou)) { id(decision).publish_state("Alarme à traiter : programmation suspendue"); return; }
          if (!id(prog_on).state) { id(decision).publish_state("Programmation désactivée"); return; }

          // today's time slots
          std::string slots;
          switch (now.day_of_week) {
            case 1: slots = id(pl_dim).state; break;
            case 2: slots = id(pl_lun).state; break;
            case 3: slots = id(pl_mar).state; break;
            case 4: slots = id(pl_mer).state; break;
            case 5: slots = id(pl_jeu).state; break;
            case 6: slots = id(pl_ven).state; break;
            default: slots = id(pl_sam).state; break;
          }
          const int cur = now.hour * 60 + now.minute;
          bool plage = false;
          size_t pos = 0;
          while (pos < slots.size()) {
            size_t end = slots.find(',', pos);
            if (end == std::string::npos) end = slots.size();
            int h1, m1, h2, m2;
            if (sscanf(slots.substr(pos, end - pos).c_str(), "%d:%d-%d:%d", &h1, &m1, &h2, &m2) == 4) {
              int a = h1 * 60 + m1, b = h2 * 60 + m2;
              if (b == 0) b = 24 * 60;
              if (cur >= a && cur < b) plage = true;
            }
            pos = end + 1;
          }

          // temperature source
          float t = NAN;
          std::string src = "aucune";
          if (id(ble_ms) != 0 && millis() - id(ble_ms) < 10UL * 60 * 1000 && id(ble_temp) > 3) { t = id(ble_temp); src = "Bluetooth"; }
          // HA only pushes the temperature when it changes: while connected the last value stays valid,
          // after a disconnection it is kept 30 more minutes.
          else if (id(ha_ms) != 0 && id(temp_ha).state > 3 && (api::global_api_server->is_connected() || millis() - id(ha_ms) < 30UL * 60 * 1000)) { t = id(temp_ha).state; src = "HA"; }
          const bool t_valide = !std::isnan(t);
          const float c = id(consigne).state;
          const bool temp_ok = t_valide && (allume ? (t < c + 0.5f) : (t < c - 0.5f));

          const std::string mode = id(mode_prog).current_option();
          bool voulu;
          if (mode == "Horaire seul") voulu = plage;
          else if (!t_valide) voulu = (mode != "Température seule") ? plage : false;
          else if (mode == "Température seule") voulu = temp_ok;
          else voulu = plage && temp_ok;

          const int depuis = ((int) now.timestamp - id(dernier_changement)) / 60;
          char buf[180];
          snprintf(buf, sizeof(buf), "%02d:%02d %s | plage %s | T %s %.1f (%s) / consigne %.1f | %d min",
                   now.hour, now.minute, voulu ? "chauffer" : "arrêt", plage ? "oui" : "non", t_valide ? "" : "?", t_valide ? t : 0.0f,
                   src.c_str(), c, depuis);
          id(decision).publish_state(buf);

          if (voulu && !allume && etat == "Éteint" && depuis >= 30) {
            ESP_LOGI("prog", "Allumage (%s)", buf);
            id(poele_sw).turn_on();
          } else if (!voulu && allume && depuis >= 45 && etat.rfind("Extinction", 0) != 0) {
            ESP_LOGI("prog", "Extinction (%s)", buf);
            id(poele_sw).turn_off();
          }
