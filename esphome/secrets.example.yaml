# Copy the keys you are missing into your ESPHome secrets.yaml
# (ESPHome dashboard -> top-right menu -> Secrets). Never commit the real file.

wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# 32-byte base64 key: generate one at https://esphome.io/components/api.html (or let the
# ESPHome dashboard create it when you add a new device)
api_key_poele: "REPLACE_WITH_A_BASE64_KEY="
ota_password_poele: "choose-an-ota-password"
ap_password_poele: "fallback-hotspot-password"
