# Home Assistant package for the pellet stove: helpers (the UI) + sync to the ESP + alarm lock.
#
# Since v2 the schedule/thermostat runs ON THE ESP (it keeps working without Wi-Fi/HA).
# Home Assistant is the interface: change the setpoint, mode, on/off or time slots here or on
# the card, and the "poele_synchro_esp" automation copies them into the ESP immediately.
#
# Install:
#   1. configuration.yaml ->   homeassistant:
#                                packages: !include_dir_named packages
#   2. Copy this file to <config>/packages/pellet_stove.yaml
#   3. Set your room thermometer in the ESPHome config (substitution room_temperature_entity).
#   4. Restart Home Assistant, then edit the time slots from the card
#      (or Settings -> Devices & services -> Helpers -> "Poêle - plages horaires").

input_boolean:
  poele_programmation:
    name: Poêle - programmation
    icon: mdi:calendar-clock
  # Set by the poele_alarme automation; blocks the schedule until the stove is re-armed
  poele_alarme_a_traiter:
    name: Poêle - alarme à traiter
    icon: mdi:alert-octagon

input_text:
  # "<alarm> — <what to do>", shown by the card
  poele_cause_alarme:
    name: Poêle - cause alarme
    max: 255
    icon: mdi:alert-circle-outline

input_number:
  poele_consigne:
    name: Poêle - consigne
    min: 15
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer

input_select:
  poele_mode_programmation:
    name: Poêle - mode de programmation
    options:
      - "Horaire + température"   # heat during time slots, only if below setpoint
      - "Horaire seul"            # heat during time slots, ignore temperature
      - "Température seule"       # plain thermostat, ignore time slots
    icon: mdi:tune-variant

# Example slots only: change them to fit your life (UI editing is easier).
schedule:
  poele_plages_horaires:
    name: Poêle - plages horaires
    icon: mdi:calendar-week
    monday: &weekday
      - from: "06:00:00"
        to: "08:30:00"
      - from: "17:00:00"
        to: "22:00:00"
    tuesday: *weekday
    wednesday: *weekday
    thursday: *weekday
    friday: *weekday
    saturday: &weekend
      - from: "08:00:00"
        to: "22:30:00"
    sunday: *weekend

automation:
  # Copies the helpers into the ESP (which runs the schedule itself).
  # Also runs every 15 min and whenever the ESP reconnects.
  - id: poele_synchro_esp
    alias: Poêle - synchro ESP
    description: >-
      Copies setpoint, mode, on/off and time slots into the stove ESP,
      which runs the schedule itself (even without Home Assistant).
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id:
          - input_number.poele_consigne
          - input_select.poele_mode_programmation
          - input_boolean.poele_programmation
      - trigger: state
        entity_id: switch.poele_poele
        from: "unavailable"
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('switch.poele_poele') not in ['unavailable', 'unknown'] }}"
    actions:
      - action: schedule.get_schedule
        target:
          entity_id: schedule.poele_plages_horaires
        response_variable: sched
      - action: number.set_value
        target:
          entity_id: number.poele_consigne_esp
        data:
          value: "{{ states('input_number.poele_consigne') }}"
      - action: select.select_option
        target:
          entity_id: select.poele_mode_esp
        data:
          option: "{{ states('input_select.poele_mode_programmation') }}"
      - action: "switch.turn_{{ 'on' if is_state('input_boolean.poele_programmation', 'on') else 'off' }}"
        target:
          entity_id: switch.poele_programmation_esp
      - action: text.set_value
        target:
          entity_id: text.poele_plages_lundi
        data:
          # time objects can't be stored in variables: read the response directly
          value: >-
            {% set ns = namespace(l=[]) %}{% for x in sched['schedule.poele_plages_horaires'].monday | default([]) %}{% set ns.l = ns.l + [(x['from'] | string)[:5] ~ '-' ~ (x['to'] | string)[:5]] %}{% endfor %}{{ ns.l | join(',') }}
      - action: text.set_value
        target:
          entity_id: text.poele_plages_mardi
        data:
          # time objects can't be stored in variables: read the response directly
          value: >-
            {% set ns = namespace(l=[]) %}{% for x in sched['schedule.poele_plages_horaires'].tuesday | default([]) %}{% set ns.l = ns.l + [(x['from'] | string)[:5] ~ '-' ~ (x['to'] | string)[:5]] %}{% endfor %}{{ ns.l | join(',') }}
      - action: text.set_value
        target:
          entity_id: text.poele_plages_mercredi
        data:
          # time objects can't be stored in variables: read the response directly
          value: >-
            {% set ns = namespace(l=[]) %}{% for x in sched['schedule.poele_plages_horaires'].wednesday | default([]) %}{% set ns.l = ns.l + [(x['from'] | string)[:5] ~ '-' ~ (x['to'] | string)[:5]] %}{% endfor %}{{ ns.l | join(',') }}
      - action: text.set_value
        target:
          entity_id: text.poele_plages_jeudi
        data:
          # time objects can't be stored in variables: read the response directly
          value: >-
            {% set ns = namespace(l=[]) %}{% for x in sched['schedule.poele_plages_horaires'].thursday | default([]) %}{% set ns.l = ns.l + [(x['from'] | string)[:5] ~ '-' ~ (x['to'] | string)[:5]] %}{% endfor %}{{ ns.l | join(',') }}
      - action: text.set_value
        target:
          entity_id: text.poele_plages_vendredi
        data:
          # time objects can't be stored in variables: read the response directly
          value: >-
            {% set ns = namespace(l=[]) %}{% for x in sched['schedule.poele_plages_horaires'].friday | default([]) %}{% set ns.l = ns.l + [(x['from'] | string)[:5] ~ '-' ~ (x['to'] | string)[:5]] %}{% endfor %}{{ ns.l | join(',') }}
      - action: text.set_value
        target:
          entity_id: text.poele_plages_samedi
        data:
          # time objects can't be stored in variables: read the response directly
          value: >-
            {% set ns = namespace(l=[]) %}{% for x in sched['schedule.poele_plages_horaires'].saturday | default([]) %}{% set ns.l = ns.l + [(x['from'] | string)[:5] ~ '-' ~ (x['to'] | string)[:5]] %}{% endfor %}{{ ns.l | join(',') }}
      - action: text.set_value
        target:
          entity_id: text.poele_plages_dimanche
        data:
          # time objects can't be stored in variables: read the response directly
          value: >-
            {% set ns = namespace(l=[]) %}{% for x in sched['schedule.poele_plages_horaires'].sunday | default([]) %}{% set ns.l = ns.l + [(x['from'] | string)[:5] ~ '-' ~ (x['to'] | string)[:5]] %}{% endfor %}{{ ns.l | join(',') }}

  - id: poele_alarme
    alias: Poêle - alarme
    description: >-
      Notifies when the stove goes into alarm (the ESP locks its schedule by itself).
      Unlocked manually with the "Poêle - réarmer" script (button on the card).
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.poele_etat
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state.startswith('Alarme') }}"
    variables:
      conseil: >-
        {% set e = trigger.to_state.state %}{% if 'granulés' in e %}Réservoir vide : recharge les granulés, vide le brasier (granulés non brûlés), puis réarme le poêle.{% elif 'allumage' in e %}Le feu n'a pas pris : vérifie le réservoir, vide le brasier avant toute relance, puis réarme. Si ça se répète réservoir plein : bougie d'allumage ou brasier encrassé.{% else %}Alarme du poêle : regarde le code sur l'afficheur du poêle, vide le brasier, puis réarme.{% endif %}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.poele_alarme_a_traiter
      - action: input_text.set_value
        target:
          entity_id: input_text.poele_cause_alarme
        data:
          value: "{{ (trigger.to_state.state ~ ' — ' ~ conseil)[:255] }}"
      - action: persistent_notification.create
        data:
          notification_id: poele_alarme
          title: "🔥 Poêle : {{ trigger.to_state.state }}"
          message: "{{ conseil }}\n\nLa programmation est suspendue tant que le poêle n'est pas réarmé."

script:
  poele_rearmer:
    alias: Poêle - réarmer
    description: >-
      Run once the problem is fixed and the brazier emptied: clears the stove alarm
      and resumes the schedule.
    icon: mdi:restart-alert
    mode: single
    sequence:
      - action: button.press   # clears the ESP's own alarm lock (and switches the stove off)
        target:
          entity_id: button.poele_rearmer
      - action: switch.turn_off   # on a Micronova board, "off" clears the alarm
        target:
          entity_id: switch.poele_poele
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.poele_alarme_a_traiter
      - action: input_text.set_value
        target:
          entity_id: input_text.poele_cause_alarme
        data:
          value: ""
      - action: persistent_notification.dismiss
        data:
          notification_id: poele_alarme
